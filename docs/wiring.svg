<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <style>
    .bg{fill:#f7f4ed}.board{fill:#183b56;stroke:#102a40;stroke-width:4}
    .disp{fill:#fff;stroke:#d97706;stroke-width:4}
    .title{font: bold 30px Arial;fill:#172b3a}
    .label{font: bold 21px Arial;fill:#172b3a}
    .small{font: 17px Arial;fill:#243746}
    .pin{font: bold 18px Arial;fill:#fff}
    .wire{fill:none;stroke-width:5;stroke-linecap:round}
    .gnd{stroke:#64748b}.pwr{stroke:#dc2626}.sig{stroke:#2563eb}
  </style>
</defs>
<rect class="bg" width="1200" height="700"/>
<text x="600" y="55" text-anchor="middle" class="title">ESP32-C3 Super Mini → GC9A01 (240 × 240)</text>
<text x="600" y="88" text-anchor="middle" class="small">Repeat the same wiring for MASTER and SLAVE</text>

<!-- ESP32 board -->
<rect class="board" x="105" y="145" rx="28" width="390" height="465"/>
<text x="300" y="190" text-anchor="middle" style="font:bold 28px Arial;fill:#fff">ESP32-C3</text>
<text x="300" y="222" text-anchor="middle" style="font:18px Arial;fill:#dbeafe">Super Mini</text>
<rect x="220" y="250" width="160" height="85" rx="12" fill="#0b2235" stroke="#9fb3c8" stroke-width="2"/>
<text x="300" y="300" text-anchor="middle" style="font:bold 20px Arial;fill:#cbd5e1">ESP32-C3</text>
<g class="pin">
<text x="135" y="390">3V3</text><text x="135" y="440">GND</text>
<text x="135" y="490">GPIO 7</text><text x="135" y="540">GPIO 2</text>
<text x="405" y="390" text-anchor="end">GPIO 3</text><text x="405" y="440" text-anchor="end">GPIO 6</text><text x="405" y="490" text-anchor="end">GPIO 4</text>
</g>
<!-- display -->
<rect class="disp" x="770" y="165" rx="30" width="310" height="310"/>
<circle cx="925" cy="320" r="112" fill="#101820"/>
<circle cx="925" cy="320" r="84" fill="#d97706"/>
<circle cx="925" cy="320" r="58" fill="#0f172a"/>
<circle cx="905" cy="298" r="13" fill="#fff"/>
<text x="925" y="520" text-anchor="middle" class="label">GC9A01 TFT</text>
<text x="925" y="548" text-anchor="middle" class="small">Round display · 240 × 240</text>
<!-- display pins -->
<g class="small">
<text x="805" y="590">BLK</text><text x="805" y="620">CS</text><text x="805" y="650">DC</text>
<text x="1010" y="590" text-anchor="end">RES / RST</text>
<text x="1010" y="620" text-anchor="end">SDA / MOSI</text>
<text x="1010" y="650" text-anchor="end">SCL / SCK</text>
<text x="925" y="680" text-anchor="middle">VCC · GND</text>
</g>
<!-- wires: conceptual color-coded paths -->
<path class="wire pwr" d="M165 380 H610 V565 H785 V580"/>
<path class="wire pwr" d="M165 380 H650 V130 H1040 V580"/>
<path class="wire gnd" d="M165 430 H625 V605 H785 V610"/>
<path class="wire gnd" d="M165 430 H680 V690 H1040 V610"/>
<path class="wire sig" d="M165 480 H590 V620 H785 V620"/>
<path class="wire sig" d="M165 530 H555 V650 H785 V650"/>
<path class="wire sig" d="M435 380 H700 V580 H1040 V580"/>
<path class="wire sig" d="M435 430 H720 V620 H1040 V620"/>
<path class="wire sig" d="M435 480 H740 V650 H1040 V650"/>
<text x="600" y="165" class="small" text-anchor="middle">SPI + power connections</text>
<rect x="110" y="630" width="980" height="48" rx="12" fill="#fff" stroke="#d6d3d1"/>
<text x="600" y="660" text-anchor="middle" class="small">BLK → 3V3 · CS → GPIO7 · DC → GPIO2 · RES → GPIO3 · SDA → GPIO6 · SCL → GPIO4 · VCC → 3V3 · GND → GND</text>
</svg>